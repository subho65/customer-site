<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Print Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">
    <div class="max-w-md w-full bg-white p-6 rounded-lg shadow-md mt-10">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">Scan & Print</h2>

        <!-- File Input -->
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-2">Upload PDF File</label>
            <input type="file" id="fileInput" accept="application/pdf" class="w-full p-2 border rounded">
        </div>

        <!-- Print Options -->
        <div class="mb-4 grid grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm mb-1">Color Mode</label>
                <select id="colorMode" class="w-full p-2 border rounded">
                    <option value="false">Black & White</option>
                    <option value="true">Color</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 text-sm mb-1">Copies</label>
                <input type="number" id="copies" value="1" min="1" class="w-full p-2 border rounded">
            </div>
        </div>

        <button onclick="submitPrintJob()" id="submitBtn"
            class="w-full bg-blue-600 text-white p-3 rounded font-semibold hover:bg-blue-700 transition">
            Submit Print Job
        </button>
        <p id="statusMsg" class="mt-4 text-center text-sm font-medium text-gray-600"></p>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL DEPLOYED SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://zokjpxvwzmhiapkeifen.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpva2pweHZ3em1oaWFwa2VpZmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MTA5OTIsImV4cCI6MjA5NzQ4Njk5Mn0.XgvacQ3KXx5F1EusaKw_OcX6c5Q88vjM2xlHnJFS7GM";

            // Fix: We changed the variable name here to 'supabaseClient'
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            async function submitPrintJob() {
            const fileInput = document.getElementById('fileInput');
            const colorMode = document.getElementById('colorMode').value === "true";
            const copies = parseInt(document.getElementById('copies').value);
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (!fileInput.files.length) {
                alert("Please select a PDF file first.");
            return;
            }

            const file = fileInput.files[0];
            const fileName = `${Date.now()}_${file.name}`;
            
            submitBtn.disabled = true;
            statusMsg.innerText = "Uploading to cloud...";

            // Fix: Changed 'supabase.storage' to 'supabaseClient.storage'
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('print-files')
                .upload(fileName, file);

            if (uploadError) {
                console.error("Upload error details:", uploadError);
                statusMsg.innerText = "Upload failed!";
                submitBtn.disabled = false;
                return;
            }

            // Fix: Changed 'supabase.storage' to 'supabaseClient.storage'
            const { data: urlData } = supabaseClient.storage
                .from('print-files')
                .getPublicUrl(fileName);

            const fileUrl = urlData.publicUrl;

            // Fix: Changed 'supabase.from' to 'supabaseClient.from'
            statusMsg.innerText = "Adding to shop queue...";
            const { error: dbError } = await supabaseClient
                .from('print_jobs')
                .insert([{
                    file_url: fileUrl,
                    filename: file.name,
                    copies: copies,
                    color: colorMode,
                    status: 'Ready to Print',
                    payment_status: 'Cash at Counter'
                }]);

            if (dbError) {
                console.error("Database error details:", dbError);
                statusMsg.innerText = "Database error! Please try again.";
            } else {
                statusMsg.innerText = "File uploaded! Please ask shopkeeper to print.";
                fileInput.value = "";
            }
            submitBtn.disabled = false;
        }
    </script>
</body>

</html>
