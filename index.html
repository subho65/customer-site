<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Print Spot</title>
    <!-- Supabase, PDF.js, and Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">🖨️ Cloud Print Spot</h2>
        
        <!-- Customer Name Input -->
        <div class="mb-4">
            <label class="block text-slate-700 font-semibold mb-1">Your Name</label>
            <input type="text" id="custName" placeholder="Enter your name" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>

        <!-- File Selector -->
        <div class="mb-4">
            <label class="block text-slate-700 font-semibold mb-2">Select PDF, PNG, or JPG</label>
            <input type="file" id="fileInput" accept="application/pdf, image/png, image/jpeg" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>

        <!-- Visual Preview Box -->
        <div id="previewContainer" class="hidden mb-4 p-2 border rounded-lg bg-slate-50 flex flex-col items-center">
            <p class="text-xs text-slate-500 mb-1">File Preview:</p>
            <img id="imagePreview" class="hidden max-h-48 rounded object-contain border" src="" alt="Image Preview">
            <canvas id="pdfPreview" class="hidden max-h-48 rounded border"></canvas>
            <p class="text-xs font-semibold text-blue-600 mt-2">Total Pages: <span id="pageCountDisplay">1</span></p>
        </div>

        <!-- Print Options (Visible after file selection) -->
        <div id="printOptions" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-600 text-sm mb-1">Color Mode</label>
                    <select id="colorMode" onchange="calculateCost()" class="w-full p-2 border rounded-lg bg-white">
                        <option value="false">Black & White (Grayscale)</option>
                        <option value="true">Color</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-600 text-sm mb-1">Copies</label>
                    <input type="number" id="copies" value="1" min="1" onchange="calculateCost()" class="w-full p-2 border rounded-lg">
                </div>
            </div>

            <!-- Pricing Box -->
            <div class="p-3 bg-slate-900 text-white rounded-xl flex justify-between items-center">
                <span class="font-semibold text-md">Total Cost:</span>
                <span class="text-xl font-bold text-green-400">₹<span id="priceDisplay">0.00</span></span>
            </div>

            <!-- Payment Method Selector -->
            <div>
                <label class="block text-slate-700 font-semibold mb-2">Select Payment Method</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="setPaymentMethod('Cash')" id="payCashBtn" class="p-3 border-2 rounded-xl text-center font-bold border-slate-300 text-slate-700 bg-white hover:border-slate-400 transition">
                        Pay Cash at Counter
                    </button>
                    <button type="button" onclick="setPaymentMethod('Online')" id="payOnlineBtn" class="p-3 border-2 rounded-xl text-center font-bold border-slate-300 text-slate-700 bg-white hover:border-slate-400 transition">
                        Pay Online (Razorpay)
                    </button>
                </div>
            </div>

            <!-- Submit Order -->
            <button onclick="submitPrintJob()" id="submitBtn" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">
                Place Print Order
            </button>
        </div>
        <p id="statusMsg" class="mt-4 text-center text-sm font-medium text-slate-600"></p>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://zokjpxvwzmhiapkeifen.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpva2pweHZ3em1oaWFwa2VpZmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MTA5OTIsImV4cCI6MjA5NzQ4Njk5Mn0.XgvacQ3KXx5F1EusaKw_OcX6c5Q88vjM2xlHnJFS7GM";
        
        // Configured with your provided Test Key ID
        const RAZORPAY_KEY_ID = "rzp_test_T3nkgF0kb1m4eA"; 
        const SHOP_NAME = "Subhojati Dutta";

        const BW_RATE = 2.00;
        const COLOR_RATE = 10.00;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let totalPages = 1;
        let finalCost = 0;
        let selectedFile = null;
        let paymentMethod = "";

        // --- 2. SELECT FILE & GENERATE VISUAL PREVIEW ---
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFile = file;
            totalPages = 1; // Reset default to 1 for images

            const imgPreview = document.getElementById('imagePreview');
            const pdfPreview = document.getElementById('pdfPreview');
            const previewContainer = document.getElementById('previewContainer');
            
            imgPreview.classList.add('hidden');
            pdfPreview.classList.add('hidden');
            previewContainer.classList.remove('hidden');

            // If it is an image
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    imgPreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
                document.getElementById('pageCountDisplay').innerText = "1 (Image)";
                document.getElementById('printOptions').classList.remove('hidden');
                calculateCost();
            } 
            // If it is a PDF
            else if (file.type === 'application/pdf') {
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    try {
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        totalPages = pdf.numPages;
                        document.getElementById('pageCountDisplay').innerText = totalPages;

                        // Render page 1 to canvas for preview
                        const page = await pdf.getPage(1);
                        const viewport = page.getViewport({ scale: 0.5 });
                        const canvas = pdfPreview;
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        pdfPreview.classList.remove('hidden');
                        document.getElementById('printOptions').classList.remove('hidden');
                        calculateCost();
                    } catch (err) {
                        alert("Error reading PDF file!");
                    }
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        // --- 3. DYNAMIC CALCULATE PRICE ---
        function calculateCost() {
            const colorMode = document.getElementById('colorMode').value === "true";
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const rate = colorMode ? COLOR_RATE : BW_RATE;
            finalCost = totalPages * copies * rate;
            document.getElementById('priceDisplay').innerText = finalCost.toFixed(2);
        }

        // --- 4. SELECT PAYMENT WAY ---
        function setPaymentMethod(method) {
            paymentMethod = method;
            const cashBtn = document.getElementById('payCashBtn');
            const onlineBtn = document.getElementById('payOnlineBtn');

            if (method === "Cash") {
                cashBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                onlineBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            } else {
                onlineBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                cashBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                calculateCost();
            }
        }

        // --- 5. SUBMIT ORDER FLOW ---
        async function submitPrintJob() {
            const name = document.getElementById('custName').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (!name) {
                alert("Please enter your name first!");
                return;
            }
            if (!paymentMethod) {
                alert("Please choose a payment method!");
                return;
            }
            if (!selectedFile) {
                alert("Please select a file first!");
                return;
            }

            submitBtn.disabled = true;

            if (paymentMethod === "Cash") {
                // Flow for offline/cash payment
                statusMsg.innerText = "Uploading file to cloud folder...";
                const fileName = `${Date.now()}_${selectedFile.name}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from('print-files')
                    .upload(fileName, selectedFile);

                if (uploadError) {
                    statusMsg.innerText = "File upload failed!";
                    submitBtn.disabled = false;
                    return;
                }

                const { data: urlData } = supabaseClient.storage
                    .from('print-files')
                    .getPublicUrl(fileName);

                statusMsg.innerText = "Adding order to counter dashboard...";

                const { error: dbError } = await supabaseClient
                    .from('print_jobs')
                    .insert([{
                        file_url: urlData.publicUrl,
                        filename: selectedFile.name,
                        copies: parseInt(document.getElementById('copies').value) || 1,
                        color: document.getElementById('colorMode').value === "true",
                        status: 'Pending Approval',
                        payment_status: 'Cash at Shop'
                    }]);

                if (dbError) {
                    console.error(dbError);
                    statusMsg.innerText = "Error queueing your order.";
                } else {
                    statusMsg.innerHTML = "🎉 <b class='text-green-600'>Order Placed!</b> Tell the counter your name (<b>" + name + "</b>).";
                    resetForm();
                }
                submitBtn.disabled = false;

            } else {
                // Razorpay Online Integration Flow
                statusMsg.innerText = "Preparing payment portal...";

                const options = {
                    key: RAZORPAY_KEY_ID, 
                    amount: Math.round(finalCost * 100), // Razorpay accepts payments in subunits (paise)
                    currency: "INR",
                    name: SHOP_NAME,
                    description: `Print Job: ${selectedFile.name}`,
                    prefill: {
                        name: name
                    },
                    theme: {
                        color: "#2563EB" // Matches Tailwind's blue-600
                    },
                    handler: async function (response) {
                        // This callback executes only after successful transaction verification
                        statusMsg.innerText = "Payment verification successful. Uploading print file...";

                        const fileName = `${Date.now()}_${selectedFile.name}`;
                        
                        // 1. Upload to Supabase bucket
                        const { error: uploadError } = await supabaseClient.storage
                            .from('print-files')
                            .upload(fileName, selectedFile);

                        if (uploadError) {
                            statusMsg.innerHTML = `<span class='text-red-600 font-bold'>Upload Failed!</span> Please show this screen to the administrator. Payment ID: <b>${response.razorpay_payment_id}</b>`;
                            submitBtn.disabled = false;
                            return;
                        }

                        // 2. Fetch public URL
                        const { data: urlData } = supabaseClient.storage
                            .from('print-files')
                            .getPublicUrl(fileName);

                        statusMsg.innerText = "Adding order to dashboard queue...";

                        // 3. Update status in print_jobs database
                        const { error: dbError } = await supabaseClient
                            .from('print_jobs')
                            .insert([{
                                file_url: urlData.publicUrl,
                                filename: selectedFile.name,
                                copies: parseInt(document.getElementById('copies').value) || 1,
                                color: document.getElementById('colorMode').value === "true",
                                status: 'Pending Approval',
                                payment_status: `Paid Online (Razorpay ID: ${response.razorpay_payment_id})`
                            }]);

                        if (dbError) {
                            console.error(dbError);
                            statusMsg.innerHTML = `<span class='text-red-600 font-bold'>Order registration error!</span> Contact support with Payment ID: <b>${response.razorpay_payment_id}</b>`;
                        } else {
                            statusMsg.innerHTML = "🎉 <b class='text-green-600'>Order Placed & Paid!</b> Mention your name (<b>" + name + "</b>) at the counter.";
                            resetForm();
                        }
                        submitBtn.disabled = false;
                    },
                    modal: {
                        ondismiss: function () {
                            statusMsg.innerText = "Payment window closed.";
                            submitBtn.disabled = false;
                        }
                    }
                };

                const rzp = new Razorpay(options);
                rzp.open();
            }
        }

        // Helper to clear inputs and state on success
        function resetForm() {
            document.getElementById('printOptions').classList.add('hidden');
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('fileInput').value = "";
            document.getElementById('custName').value = "";
            paymentMethod = "";
            
            const cashBtn = document.getElementById('payCashBtn');
            const onlineBtn = document.getElementById('payOnlineBtn');
            cashBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            onlineBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
        }
    </script>
</body>
</html>
