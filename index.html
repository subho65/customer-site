<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Print Spot</title>
    <!-- Tailwind CSS, Supabase and PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
        <h2 class="text-2xl font-bold mb-4 text-center text-blue-600">🖨️ Cloud Print Spot</h2>
        
        <!-- Customer Name Input -->
        <div class="mb-4">
            <label class="block text-slate-700 font-semibold mb-1">Your Name</label>
            <input type="text" id="custName" placeholder="Enter your name" class="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- File Selector -->
        <div class="mb-4">
            <label class="block text-slate-700 font-semibold mb-2">Select PDF, PNG, or JPG</label>
            <input type="file" id="fileInput" accept="application/pdf, image/png, image/jpeg" class="w-full p-2 border border-slate-300 rounded-lg">
        </div>

        <!-- Visual Preview Box -->
        <div id="previewContainer" class="hidden mb-4 p-2 border rounded-lg bg-slate-50 flex flex-col items-center">
            <p class="text-xs text-slate-500 mb-1">File Preview:</p>
            <img id="imagePreview" class="hidden max-h-48 rounded object-contain border" src="" alt="Image Preview">
            <canvas id="pdfPreview" class="hidden max-h-48 rounded border"></canvas>
            <p class="text-xs font-semibold text-blue-600 mt-2">Total Pages: <span id="pageCountDisplay">1</span></p>
        </div>

        <!-- Print Options (Visible after file selection) -->
        <div id="printOptions" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-slate-600 text-sm mb-1">Color Mode</label>
                    <select id="colorMode" onchange="calculateCost()" class="w-full p-2 border rounded-lg bg-white">
                        <option value="false">Black & White (Grayscale)</option>
                        <option value="true">Color</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-600 text-sm mb-1">Copies</label>
                    <input type="number" id="copies" value="1" min="1" onchange="calculateCost()" class="w-full p-2 border rounded-lg">
                </div>
            </div>

            <!-- Pricing Box -->
            <div class="p-3 bg-slate-900 text-white rounded-xl flex justify-between items-center">
                <span class="font-semibold text-md">Total Cost:</span>
                <span class="text-xl font-bold text-green-400">₹<span id="priceDisplay">0.00</span></span>
            </div>

            <!-- Payment Method Selector -->
            <div>
                <label class="block text-slate-700 font-semibold mb-2">Select Payment Method</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="setPaymentMethod('Cash')" id="payCashBtn" class="p-3 border-2 rounded-xl text-center font-bold border-slate-300 text-slate-700 bg-white">
                        Pay Cash at Counter
                    </button>
                    <button type="button" onclick="setPaymentMethod('Online')" id="payOnlineBtn" class="p-3 border-2 rounded-xl text-center font-bold border-slate-300 text-slate-700 bg-white">
                        Pay Online (UPI)
                    </button>
                </div>
            </div>

            <!-- Mobile UPI Launch & QR Box -->
            <div id="upiRedirectBox" class="hidden flex flex-col items-center p-4 border border-blue-200 bg-blue-50 rounded-xl space-y-4">
                
                <!-- QR Code (Universal & 100% Reliable) -->
                <div class="flex flex-col items-center bg-white p-3 rounded-lg shadow-sm border border-slate-200 w-full">
                    <p class="text-xs font-semibold text-slate-500 mb-2">Scan QR with any app (GPay/PhonePe/Paytm):</p>
                    <img id="qrImage" class="w-44 h-44 bg-white" src="" alt="UPI QR Code">
                </div>

                <!-- Direct App Launchers (For mobile users) -->
                <div class="w-full space-y-2">
                    <p class="text-xs font-semibold text-center text-slate-500">Or Tap to open your App directly:</p>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <!-- PhonePe Button -->
                        <a id="phonepeLink" href="#" class="bg-purple-600 text-white py-2 px-1 rounded-lg text-center font-bold text-xs shadow hover:bg-purple-700 block transition">
                            PhonePe
                        </a>
                        <!-- Paytm Button -->
                        <a id="paytmLink" href="#" class="bg-blue-500 text-white py-2 px-1 rounded-lg text-center font-bold text-xs shadow hover:bg-blue-600 block transition">
                            Paytm
                        </a>
                        <!-- Google Pay Button -->
                        <a id="gpayLink" href="#" class="bg-green-600 text-white py-2 px-1 rounded-lg text-center font-bold text-xs shadow hover:bg-green-700 block transition">
                            GPay
                        </a>
                    </div>
                </div>

                <p class="text-[10px] text-slate-500 text-center">After making your payment, click "Confirm Payment & Order" below to send your file to the printer queue.</p>
            </div>

            <!-- Submit Order -->
            <button onclick="generatePayment()" id="actionBtn" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">
                Proceed to Pay
            </button>
        </div>
        <p id="statusMsg" class="mt-4 text-center text-sm font-medium text-slate-600"></p>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SUPABASE_URL = "https://zokjpxvwzmhiapkeifen.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpva2pweHZ3em1oaWFwa2VpZmVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5MTA5OTIsImV4cCI6MjA5NzQ4Njk5Mn0.XgvacQ3KXx5F1EusaKw_OcX6c5Q88vjM2xlHnJFS7GM";
        
        const UPI_ID = "7797440385@upi"; // <--- REPLACE WITH YOUR REAL UPI ID HERE
        const SHOP_NAME = "Smart Print Spot";

        const BW_RATE = 2.00;
        const COLOR_RATE = 10.00;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let totalPages = 1;
        let finalCost = 0;
        let selectedFile = null;
        let paymentMethod = "";

        // --- 2. SELECT FILE & GENERATE VISUAL PREVIEW ---
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            selectedFile = file;
            totalPages = 1; // Reset default to 1 for images

            const imgPreview = document.getElementById('imagePreview');
            const pdfPreview = document.getElementById('pdfPreview');
            const previewContainer = document.getElementById('previewContainer');
            
            imgPreview.classList.add('hidden');
            pdfPreview.classList.add('hidden');
            previewContainer.classList.remove('hidden');

            // If it is an image
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    imgPreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
                document.getElementById('pageCountDisplay').innerText = "1 (Image)";
                document.getElementById('printOptions').classList.remove('hidden');
                calculateCost();
            } 
            // If it is a PDF
            else if (file.type === 'application/pdf') {
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    try {
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        totalPages = pdf.numPages;
                        document.getElementById('pageCountDisplay').innerText = totalPages;

                        const page = await pdf.getPage(1);
                        const viewport = page.getViewport({ scale: 0.5 });
                        const canvas = pdfPreview;
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        pdfPreview.classList.remove('hidden');
                        document.getElementById('printOptions').classList.remove('hidden');
                        calculateCost();
                    } catch (err) {
                        alert("Error reading PDF file!");
                    }
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        // --- 3. DYNAMIC CALCULATE PRICE ---
        function calculateCost() {
            const colorMode = document.getElementById('colorMode').value === "true";
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const rate = colorMode ? COLOR_RATE : BW_RATE;
            finalCost = totalPages * copies * rate;
            document.getElementById('priceDisplay').innerText = finalCost.toFixed(2);
            document.getElementById('upiAmountText').innerText = finalCost.toFixed(2);

            // Re-generate UPI payment intent link if active
            if (paymentMethod === "Online") {
                const upiUrl = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(SHOP_NAME)}&am=${finalCost.toFixed(2)}&cu=INR&tn=CloudPrint`;
                document.getElementById('upiPayLink').href = upiUrl;
            }
        }

        // --- 4. SELECT PAYMENT WAY ---
        function setPaymentMethod(method) {
            paymentMethod = method;
            const cashBtn = document.getElementById('payCashBtn');
            const onlineBtn = document.getElementById('payOnlineBtn');
            const upiBox = document.getElementById('upiRedirectBox');
            const actionBtn = document.getElementById('actionBtn');

            if (method === "Cash") {
                cashBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                onlineBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                upiBox.classList.add('hidden');
                
                // Direct print placement for Cash
                actionBtn.innerText = "Place Print Order";
                actionBtn.setAttribute("onclick", "submitPrintJob()");
            } else {
                onlineBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                cashBtn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                upiBox.classList.remove('hidden');
                
                // Show Pay options first
                actionBtn.innerText = "Proceed to Pay";
                actionBtn.setAttribute("onclick", "generatePayment()");
                calculateCost();
            }
        }

        // --- 5. GENERATE HYBRID PAYMENT (LINKS & QR) ---
        function generatePayment() {
            if (finalCost <= 0) return;

            const actionBtn = document.getElementById('actionBtn');
            const paymentBox = document.getElementById('upiRedirectBox');
            const qrImage = document.getElementById('qrImage');

            const cleanShopName = encodeURIComponent(SHOP_NAME);
            const formattedAmount = finalCost.toFixed(2);
            
            // Generate QR Code URL using free QR generation API
            const upiString = `upi://pay?pa=${UPI_ID}&pn=${cleanShopName}&am=${formattedAmount}&cu=INR&tn=CloudPrint`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
            qrImage.src = qrUrl;

            // Generate direct App Links (for iOS & Android compatibility)
            const phonepeUrl = `phonepe://pay?pa=${UPI_ID}&pn=${cleanShopName}&am=${formattedAmount}&cu=INR&tn=CloudPrint`;
            document.getElementById('phonepeLink').href = phonepeUrl;

            const paytmUrl = `paytmmp://pay?pa=${UPI_ID}&pn=${cleanShopName}&am=${formattedAmount}&cu=INR&tn=CloudPrint`;
            document.getElementById('paytmLink').href = paytmUrl;

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const gpayScheme = isIOS ? "gpay://upi/pay" : "tez://upi/pay";
            const gpayUrl = `${gpayScheme}?pa=${UPI_ID}&pn=${cleanShopName}&am=${formattedAmount}&cu=INR&tn=CloudPrint`;
            document.getElementById('gpayLink').href = gpayUrl;

            paymentBox.classList.remove('hidden');

            // Change button behavior to Upload/Confirm once clicked
            actionBtn.innerText = "Confirm Payment & Order";
            actionBtn.setAttribute("onclick", "submitPrintJob()");
        }

        // --- 6. SUBMIT TO DATABASE QUEUE ---
        async function submitPrintJob() {
            const name = document.getElementById('custName').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');

            if (!name) {
                alert("Please enter your name first!");
                return;
            }
            if (!paymentMethod) {
                alert("Please choose a payment method!");
                return;
            }

            submitBtn.disabled = true;
            statusMsg.innerText = "Uploading file to cloud folder...";

            const fileName = `${Date.now()}_${selectedFile.name}`;

            // Upload actual file to storage bucket
            const { error: uploadError } = await supabaseClient.storage
                .from('print-files')
                .upload(fileName, selectedFile);

            if (uploadError) {
                statusMsg.innerText = "File upload failed!";
                submitBtn.disabled = false;
                return;
            }

            const { data: urlData } = supabaseClient.storage
                .from('print-files')
                .getPublicUrl(fileName);

            statusMsg.innerText = "Adding order to counter dashboard...";

            // Save job to database with status: "Pending Approval"
            const { error: dbError } = await supabaseClient
                .from('print_jobs')
                .insert([{
                    file_url: urlData.publicUrl,
                    filename: selectedFile.name,
                    copies: parseInt(document.getElementById('copies').value) || 1,
                    color: document.getElementById('colorMode').value === "true",
                    status: 'Pending Approval',
                    payment_status: paymentMethod === "Online" ? `UPI App Pay (₹${finalCost.toFixed(2)})` : 'Cash at Shop'
                }]);

            if (dbError) {
                console.error(dbError);
                statusMsg.innerText = "Error queueing your order.";
            } else {
                statusMsg.innerHTML = "🎉 <b class='text-green-600'>Order Placed!</b> Tell the counter your name (<b>" + name + "</b>).";
                document.getElementById('printOptions').classList.add('hidden');
                document.getElementById('previewContainer').classList.add('hidden');
                document.getElementById('fileInput').value = "";
                document.getElementById('custName').value = "";
            }
            submitBtn.disabled = false;
        }
    </script>
</body>
</html>
